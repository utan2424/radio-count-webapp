<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Radio Type Count Dashboard</title>
    <link rel="stylesheet" href="styles.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
    <div class="container">
        <header>
            <h1>📊 Radio Type Count Dashboard</h1>
            <p>การแจกแจงประเภทวิทยุตามภูมิภาค</p>
        </header>

        <div class="controls">
            <button id="toggleView" class="btn">🔄 สลับมุมมอง</button>
            <button id="exportBtn" class="btn">📥 ดาวน์โหลด CSV</button>
        </div>

        <div class="content">
            <div id="tableView" class="view active">
                <div class="table-wrapper">
                    <table id="dataTable">
                        <thead>
                            <tr>
                                <th>ภูมิภาค</th>
                                <th>Fixed</th>
                                <th>Handheld</th>
                                <th>Mobile radio</th>
                                <th>Repeater</th>
                                <th>รวมทั้งสิ้น</th>
                            </tr>
                        </thead>
                        <tbody id="tableBody"></tbody>
                    </table>
                </div>
            </div>

            <div id="chartView" class="view">
                <div class="chart-container">
                    <canvas id="barChart"></canvas>
                </div>
                <div class="chart-container">
                    <canvas id="pieChart"></canvas>
                </div>
            </div>
        </div>

        <div class="stats">
            <div class="stat-card">
                <h3>รวมทั้งสิ้น</h3>
                <p id="totalCount" class="stat-value">0</p>
            </div>
            <div class="stat-card">
                <h3>ประเภทสูงสุด</h3>
                <p id="maxType" class="stat-value">-</p>
            </div>
            <div class="stat-card">
                <h3>ภูมิภาคสูงสุด</h3>
                <p id="maxRegion" class="stat-value">-</p>
            </div>
        </div>
    </div>

    <script src="data.js"></script>
    <script src="app.js"></script>
</body>
</html>
